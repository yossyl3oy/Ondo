version: 2
updates:
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    groups:
      rust-dependencies:
        patterns: ["*"]
    ignore:
      # windows-core must match the version re-exported by `windows` (the
      # #[interface] macro expands to ::windows_core paths). windows-core has
      # moved to 0.100 while windows is still 0.62, so bump both by hand.
      - dependency-name: windows-core
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-dependencies:
        patterns: ["*"]

  - package-ecosystem: nuget
    directory: /src-lhm
    schedule:
      interval: weekly
    groups:
      dotnet-dependencies:
        patterns: ["*"]
        exclude-patterns: ["LibreHardwareMonitorLib"]
    ignore:
      # Updated by .github/workflows/update-lhm.yml instead
      - dependency-name: LibreHardwareMonitorLib

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
